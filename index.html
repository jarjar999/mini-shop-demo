<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mini Shop</h1>
    </header>

    <main>
        <section class="product-list">

            <article class="product-card" tabindex="0">
                <h2>Laptop</h2>
                <p class="price">899 €</p>
                <button>Details anzeigen</button>
            </article>

            <article class="product-card" tabindex="0">
                <h2>Smartphone</h2>
                <p class="price">499 €</p>
                <button>Details anzeigen</button>
            </article>

            <article class="product-card" tabindex="0">
                <h2>Monitor</h2>
                <p class="price">199 €</p>
                <button>Details anzeigen</button>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
